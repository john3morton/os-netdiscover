[start]
command:/usr/local/etc/rc.d/netdiscoverd start
type:script
message:starting netdiscoverd

[stop]
command:/usr/local/etc/rc.d/netdiscoverd stop
type:script
message:stopping netdiscoverd

[restart]
command:/usr/local/etc/rc.d/netdiscoverd restart
type:script
message:restarting netdiscoverd

[reload]
command:/usr/local/etc/rc.d/netdiscoverd restart
type:script
message:reloading netdiscoverd

[status]
command:/usr/local/etc/rc.d/netdiscoverd status
type:script
message:netdiscoverd status
